name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/ci.yml"

# Garante que apenas a execução mais recente de uma mesma PR seja relevante,
# cancelando execuções anteriores em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1) FRONTEND — Lint (oxlint) + Build (Vite)
  # ─────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build de produção (Vite)
        run: npm run build

  # ─────────────────────────────────────────────────────────────────
  # 2) BACKEND — py_compile + Import check do app FastAPI
  # ─────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend — Compile & Import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências (pip)
        run: pip install -r requirements.txt

      - name: Validar compilação de todos os arquivos Python
        run: |
          find app -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Validar importação do app FastAPI
        env:
          # Mock das variáveis de ambiente necessárias para o startup do app.
          DATA_DIR: data
          GEMINI_API_KEY: test-mock-key
          NVIDIA_API_KEY: test-mock-key
        run: python -c "from app.main import app; print('FastAPI app importada com sucesso:', app.title)"

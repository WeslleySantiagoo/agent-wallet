services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parsefin-backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATA_DIR=data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parsefin-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
